<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ECEFF3" id="themeColor">
<script>(function(){var p="auto";try{p=localStorage.getItem("vowkeep.theme")||"auto";}catch(e){}var d=p==="dark"||(p!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";document.documentElement.dataset.themePref=p;var m=document.getElementById("themeColor");if(m)m.content=d?"#0C0F14":"#ECEFF3";})();</script>
<meta name="description" content="VowKeep: stake GEN on a public goal and get it back only if public evidence proves you did it. Checked by GenLayer validators.">
<title>VowKeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#ECEFF3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#131B24; --ink-2:#435060; --ink-3:#5B6775;
  --line:#D5DBE2; --line-strong:#BCC5CF;
  --sig:#A55400; --sig-hover:#8C4700; --on-sig:#FFFFFF; --sig-soft:#FBEFDF; --sig-line:#E9C493;
  --info:#2C5AA8; --info-soft:#E4ECF8; --due:#6A47B3; --due-soft:#ECE6F8; --appeal:#A0335B; --appeal-soft:#F7E3EA;
  --ok:#1E7346; --ok-soft:#E1F1E7; --part:#0D7068; --part-soft:#DDF0EE; --bad:#B0281E; --bad-soft:#F8E2DF; --idle-soft:#E9EDF1;
  --focus:#A55400;
  --shadow:0 1px 2px rgba(19,27,36,.06),0 1px 1px rgba(19,27,36,.04);
  --shadow-raise:0 6px 18px rgba(19,27,36,.08),0 1px 2px rgba(19,27,36,.06);
  --shadow-pop:0 18px 48px rgba(19,27,36,.18);
  --font:"Public Sans",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --t-xs:12.5px; --t-sm:14px; --t-md:16px; --t-lg:18px; --t-xl:22px; --t-head:clamp(26px,5.4vw,36px);
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --nav-h:64px; --side-w:232px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ground:#0C0F14; --surface:#151A21; --surface-2:#1A2029; --ink:#E8ECF2; --ink-2:#B3BCC8; --ink-3:#8F9AA8;
  --line:#262E39; --line-strong:#364150;
  --sig:#F2A93B; --sig-hover:#F7BC62; --on-sig:#1C1205; --sig-soft:#2B2213; --sig-line:#5A4321;
  --info:#86AEF2; --info-soft:#18233A; --due:#B9A1F4; --due-soft:#231C38; --appeal:#F193B4; --appeal-soft:#36192A;
  --ok:#62CD93; --ok-soft:#13291E; --part:#5FCDC2; --part-soft:#112926; --bad:#F28A80; --bad-soft:#371917; --idle-soft:#1D232C;
  --focus:#F2A93B;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-raise:0 8px 22px rgba(0,0,0,.45); --shadow-pop:0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:var(--t-md);line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;line-height:1.22;letter-spacing:-.018em}
h1{font-size:var(--t-head);font-weight:700}
h2{font-size:var(--t-lg);font-weight:700}
h3{font-size:var(--t-md);font-weight:650}
p{margin:0}
a{color:var(--ink);text-underline-offset:3px;text-decoration-color:var(--line-strong)}
a:hover{text-decoration-color:var(--sig)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--ink);color:var(--ground);padding:10px 14px;border-radius:var(--r-sm)}
.skip:focus{top:8px}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:58px;padding:0 16px;
  background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:700;font-size:18px;letter-spacing:-.02em;min-height:44px;flex:none}
.mark{width:28px;height:28px;flex:none;display:block}
.env{font-size:var(--t-xs);font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}
.grow{flex:1}
@media (max-width:479px){.topbar .env{display:none}}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);cursor:pointer;flex:none}
.iconbtn:hover{color:var(--ink);border-color:var(--line-strong)}
.walletbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;min-width:0;flex:0 1 auto;max-width:52vw;padding:0 12px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);border-radius:var(--r-sm);font:inherit;font-size:var(--t-sm);font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.walletbtn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.walletbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.walletbtn.on .dot{background:var(--ok)}
.walletbtn.warn .dot{background:var(--bad)}
.netbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--bad-soft);color:var(--ink);border-bottom:1px solid var(--line);font-size:var(--t-sm)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs ul{list-style:none;margin:0;padding:4px 6px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;border-radius:var(--r-md);border:1px solid transparent;
  color:var(--ink-3);text-decoration:none;font-size:11.5px;font-weight:600}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] svg{color:var(--sig)}
nav.tabs .side-brand,nav.tabs .side-foot{display:none}
main{padding:24px 16px 48px;max-width:1120px;margin:0 auto;min-height:70vh}
main:focus{outline:none}
footer.foot{max-width:1120px;margin:0 auto;padding:0 16px 32px;font-size:var(--t-xs);color:var(--ink-3)}
footer.foot p+p{margin-top:4px}
footer.foot .addr{color:var(--ink-2)}
@media (min-width:1024px){
  body{padding-bottom:0;padding-left:var(--side-w)}
  .topbar{padding:0 32px}
  .topbar .brand{display:none}
  .walletbtn{max-width:320px}
  nav.tabs{top:0;right:auto;width:var(--side-w);bottom:0;border-top:0;border-right:1px solid var(--line);background:var(--surface);padding:14px 12px;display:flex;flex-direction:column}
  nav.tabs .side-brand{display:flex;padding:0 8px}
  nav.tabs ul{display:flex;flex-direction:column;height:auto;padding:18px 0;gap:4px}
  nav.tabs a{flex-direction:row;justify-content:flex-start;gap:12px;height:44px;padding:0 12px;font-size:var(--t-sm);color:var(--ink-2)}
  nav.tabs a[aria-current="page"]{border-color:var(--line-strong);background:var(--surface-2)}
  nav.tabs .side-foot{display:block;margin-top:auto;padding:0 8px}
  main{padding:32px 32px 56px}
  footer.foot{padding:0 32px 32px}
}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg button{flex:1;min-height:36px;border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:var(--t-xs);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}

.stack>*+*{margin-top:16px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--ink-2)}
.small{font-size:var(--t-sm)}
.xs{font-size:var(--t-xs);color:var(--ink-3)}
.addr{word-break:break-all;letter-spacing:.01em}
.measure{max-width:62ch}
.pagehead{margin-bottom:24px}
.pagehead h1{font-size:clamp(24px,4.6vw,30px)}
.pagehead p{margin-top:6px;color:var(--ink-2);max-width:62ch}
.section{margin-top:40px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sechead .btn{flex:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);min-width:0}
@media (min-width:600px){.panel{padding:24px}}
.inset{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.callout{border:1px solid var(--line);border-left:3px solid var(--info);background:var(--info-soft);padding:12px 14px;border-radius:var(--r-md);font-size:var(--t-sm)}
.callout.warn{border-left-color:var(--sig);background:var(--sig-soft)}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.callout.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.cols{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (max-width:899px){.cols.act-first>.side{order:-1}}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start;gap:24px}.cols .side{position:sticky;top:78px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-sm);
  font:inherit;font-weight:650;font-size:var(--t-md);border:1px solid transparent;cursor:pointer;text-decoration:none;text-align:center;line-height:1.25;
  transition:background-color .15s var(--ease),border-color .15s var(--ease),box-shadow .15s var(--ease)}
.btn-primary{background:var(--sig);color:var(--on-sig)}
.btn-primary:hover{background:var(--sig-hover)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:var(--shadow)}
.btn-secondary:hover{box-shadow:var(--shadow-raise)}
.btn-quiet{background:transparent;color:var(--ink-2);border-color:transparent}
.btn-quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn-danger{background:var(--surface);color:var(--bad);border-color:var(--line-strong)}
.btn.sm{min-height:38px;padding:0 12px;font-size:var(--t-sm)}
.btn.block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions>.btn{flex:1 1 auto}
@media (min-width:600px){.actions>.btn{flex:0 0 auto}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field+.field{margin-top:16px}
.field label,.lbl-s{font-size:var(--t-sm);font-weight:650}
.help{font-size:var(--t-xs);color:var(--ink-3);overflow-wrap:anywhere}
.err{color:var(--bad);font-size:var(--t-sm);min-height:0}
.err:empty{display:none}
.input,textarea.input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
textarea.input{min-height:88px;resize:vertical}
.input[aria-invalid="true"]{border-color:var(--bad)}
.req{color:var(--sig);margin-left:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink);font:inherit;font-size:var(--t-sm);font-weight:600;cursor:pointer;text-decoration:none;position:relative;white-space:nowrap}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{border-color:var(--sig);background:var(--sig-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--sig)}
.chip .dateinp{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0;font-size:16px}
.chip .dateinp::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;opacity:0}

.status{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:650;padding:3px 10px 3px 8px;border-radius:999px;background:var(--idle-soft);color:var(--ink-2);white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-info{background:var(--info-soft);color:var(--info)} .t-due{background:var(--due-soft);color:var(--due)} .t-appeal{background:var(--appeal-soft);color:var(--appeal)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-part{background:var(--part-soft);color:var(--part)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-wait{background:var(--idle-soft);color:var(--ink-2)}

.hero{display:grid;gap:24px;grid-template-columns:minmax(0,1fr);align-items:center}
@media (min-width:860px){.hero{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.livepill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:var(--t-sm);color:var(--ink-2);box-shadow:var(--shadow)}
.livepill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.livepill b{color:var(--ink)}
.hero h1{margin-top:16px;max-width:18ch}
.lede{margin-top:12px;color:var(--ink-2);font-size:var(--t-lg);max-width:46ch;line-height:1.5}
.hero .actions{margin-top:22px}
.hero-art{max-width:420px;width:100%;justify-self:center}
.hero-art svg{width:100%;height:auto;display:block}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .7s var(--ease) .35s both}
@keyframes stamp{from{opacity:0;transform:scale(1.35) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none;transform:rotate(-8deg)}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin:28px 0 0;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stats>div{background:var(--surface);padding:14px 16px;min-width:0}
.stats dt{font-size:var(--t-xs);color:var(--ink-3);font-weight:600}
.stats dd{margin:4px 0 0;font-size:clamp(20px,4.6vw,26px);font-weight:700;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.stats dd small{font-size:var(--t-sm);font-weight:600;color:var(--ink-3);margin-left:4px}
.stats .sub{display:block;margin-top:4px;font-size:var(--t-xs);font-weight:600}
.sub.c-ok{color:var(--ok)} .sub.c-info{color:var(--info)} .sub.c-sig{color:var(--sig)} .sub.c-part{color:var(--part)}

.feed ol{list-style:none;margin:0;padding:0}
.feed li+li{border-top:1px solid var(--line)}
.feed li a,.feed li .ev{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;text-decoration:none;color:var(--ink);min-height:52px}
.feed li a:hover{background:var(--surface-2)}
.ev-i{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.ev-t{display:block;font-weight:650;font-size:var(--t-sm)}
.ev-s{display:block;font-size:var(--t-xs);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-a{font-size:var(--t-xs);color:var(--ink-3);white-space:nowrap}
.feed-foot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
@media (min-width:640px){.feed-foot{grid-template-columns:repeat(4,minmax(0,1fr))}}
.feed-foot b{display:block;font-size:var(--t-sm)}
.feed-foot span{font-size:var(--t-xs);color:var(--ink-3)}
.bal b{display:flex;align-items:center;gap:6px;color:var(--ok)}
.bal.off b{color:var(--bad)}

.roles{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.roles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.role{display:grid;grid-template-columns:48px minmax(0,1fr) 20px;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.role:hover{border-color:var(--sig);box-shadow:var(--shadow-raise)}
.tile{width:48px;height:48px;border-radius:12px;background:var(--sig-soft);border:1px solid var(--sig-line);display:flex;align-items:center;justify-content:center}
.tile svg{width:34px;height:34px}
.role .k{display:block;font-size:var(--t-xs);color:var(--ink-3);font-weight:600}
.role .t{display:block;font-weight:700}
.role .d{display:block;font-size:var(--t-sm);color:var(--ink-2);margin-top:2px}
.role .go{color:var(--ink-3)}

.sentence{font-size:clamp(18px,3.6vw,22px);line-height:2.15;font-weight:500;color:var(--ink-2)}
.tok{display:inline-block;vertical-align:baseline;min-height:38px;line-height:1.3;padding:5px 12px;margin:2px 1px;border-radius:999px;border:1px solid var(--sig-line);background:var(--sig-soft);
  color:var(--ink);font:inherit;font-weight:650;font-size:inherit;cursor:pointer;max-width:100%}
select.tok{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
input.tok{width:4.2em;text-align:center;cursor:text}
button.tok{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(100%,22ch)}
.tok:hover{border-color:var(--sig)}
.tok[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-soft)}
.issues{color:var(--bad);font-size:var(--t-sm);margin-top:8px}
.issues:empty{display:none}

details.how{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
details.how summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;cursor:pointer;font-weight:700;min-height:52px}
details.how summary::-webkit-details-marker{display:none}
details.how summary .ic{transition:transform .2s var(--ease)}
details.how[open] summary .ic{transform:rotate(180deg)}
.steps{list-style:none;margin:0;padding:0 20px 20px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.steps li{padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2)}
.steps .n{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--sig);color:var(--sig);font-weight:700;font-size:var(--t-sm)}
.steps h3{margin-top:10px}
.steps p{margin-top:4px;font-size:var(--t-sm);color:var(--ink-2)}

.cards{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.vcard{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink-3);border-radius:var(--r-lg);
  text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-width:0}

  if (/insufficient funds|insufficient balance/i.test(m)) return "This account does not have enough GEN for this transaction.";
  if (/failed to fetch|networkerror|network error|timeout|timed out|ECONN|load failed/i.test(m)) return "GenLayer Studio could not be reached. Check your connection and try again.";

    if (!ok) return;
    const res = await write(otx, "the new beneficiary", "set_beneficiary", [a, l]);
    if (res) { toast("Beneficiary set"); setTimeout(() => viewPool(root), 1200); }
  }));
  const fund = isSandbox() && account ? h("section", { class: "panel stack", "aria-labelledby": "fundH" }, h("h2", { id: "fundH", text: "Test GEN" }),
    h("p", { class: "small muted", text: "The Studio simulator can credit test GEN to the connected account. This only works on Studio." }),
    (() => { const b = h("button", { class: "btn btn-secondary block", type: "button", text: "Request 100 test GEN" });

        try {

      })); return b; })(), ftx.el) : null;
  const balanced = !!acct.balanced;
  put(root,
    h("div", { class: "pagehead" }, h("h1", { text: "The shared pool" }), h("p", { text: "Missed stakes, unreturned partial shares and rejected appeal bonds collect here. The owner names a beneficiary; anyone can send the pool to it." })),
    h("div", { class: "cols act-first" },
      h("div", { class: "stack" },

            h("div", {}, h("b", { text: genStr(pool.distributed_total) }), h("span", { text: `GEN given in ${pool.distributions} distribution${pool.distributions === 1 ? "" : "s"}` })),
            h("div", {}, h("b", { text: genStr(pool.forfeited_stakes_total) }), h("span", { text: "GEN from missed stakes" })),
            h("div", {}, h("b", { text: genStr(pool.forfeited_bonds_total) }), h("span", { text: "GEN from rejected bonds" })),

/* =====================================================================
   ROUTER
   ===================================================================== */
const TABS = [["#/", "Home", "home"], ["#/make", "Make", "plus"], ["#/vows", "Vows", "list"], ["#/mine", "Mine", "user"], ["#/pool", "Pool", "jar"]];
function drawTabs(active) {
  put($("tabList"), TABS.map(([href, label, ic]) => h("li", {}, h("a", { href, "aria-current": active === href ? "page" : null }, icon(ic, 22), h("span", { text: label })))));
}
async function route() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = raw.split("?");
  const params = new URLSearchParams(qs || "");
  const parts = path.split("/").filter(Boolean);
  const root = $("main");
  const tab = parts[0] === "vow" ? "#/vows" : "#/" + (parts[0] || "");
  drawTabs(TABS.some((t) => t[0] === tab) ? tab : "#/");
  if (hasContract && !state.cfg && !state.bootError) await boot();
  window.scrollTo(0, 0);
  if (!parts.length) return viewHome(root);
  if (parts[0] === "make") return viewMake(root);
  if (parts[0] === "vows") return viewVows(root, params);
  if (parts[0] === "vow" && parts[1]) return viewVow(root, decodeURIComponent(parts[1]));
  if (parts[0] === "mine") return viewMine(root);
  if (parts[0] === "pool") return viewPool(root);
  location.hash = "#/";
}
window.addEventListener("hashchange", route);
if (readTestKey()) startTestSession(true);
drawWallet();
route();

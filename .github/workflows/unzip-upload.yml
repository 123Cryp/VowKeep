name: Unzip uploaded project

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip into the repository
        run: |
          set -e
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No zip in the repository root"; exit 0; fi
          for z in "${zips[@]}"; do
            rm -rf /tmp/unz && mkdir /tmp/unz
            unzip -q -o "$z" -d /tmp/unz -x "__MACOSX/*" ".github/*"
            entries=(/tmp/unz/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then src="${entries[0]}"; else src=/tmp/unz; fi
            cp -a "$src"/. .
            git rm -q --cached "$z" || true
            rm -f "$z"
          done

      - name: Commit the extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Unpack uploaded project zip"
          git push
